{#include base}
  {#title}Stores - Sales - Pagila Samples{/title}
  {#body}
    <nav aria-label="breadcrumb" class="mt-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item"><a href="/stores">Stores</a></li>
        <li class="breadcrumb-item active">Sales by Store</li>
      </ol>
    </nav>
    <h2 class="mb-2"><i class="bi bi-shop me-2"></i>Stores</h2>
    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <a class="nav-link active" href="/stores/@sales-by-store"><i class="bi bi-bar-chart me-1"></i>Sales by Store</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/stores/@staff"><i class="bi bi-person-badge me-1"></i>Staff</a>
      </li>
    </ul>
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>Store</th>
          <th>Manager</th>
          <th class="text-end">Total Sales</th>
        </tr>
      </thead>
      <tbody>
        {#for row in sales}
        <tr>
          <td>{row.store}</td>
          <td>{row.manager}</td>
          <td class="text-end">${row.totalSales}</td>
        </tr>
        {/for}
      </tbody>
    </table>
  {/body}
{/include}
