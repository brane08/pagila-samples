<div class="btn-group mb-3" role="group">
  <button class="btn btn-primary btn-sm"
          hx-get="/stores/{store.storeId}/inventory"
          hx-target="#store-content"
          hx-swap="innerHTML">
    <i class="bi bi-film me-1"></i>Available Films
  </button>
  <button class="btn btn-outline-primary btn-sm"
          hx-get="/stores/{store.storeId}/rentals"
          hx-target="#store-content"
          hx-swap="innerHTML">
    <i class="bi bi-receipt me-1"></i>Rentals
  </button>
  <button class="btn btn-outline-primary btn-sm"
          hx-get="/stores/{store.storeId}/customers"
          hx-target="#store-content"
          hx-swap="innerHTML">
    <i class="bi bi-people me-1"></i>Customers
  </button>
</div>
<table class="table table-sm table-striped table-hover align-middle">
  <thead class="table-dark">
    <tr>
      <th>Title</th>
      <th>Category</th>
      <th>Rating</th>
      <th>Rate</th>
      <th class="text-center">Total</th>
      <th class="text-center">Available</th>
    </tr>
  </thead>
  <tbody>
    {#for item in items}
    <tr class="{#if item.availableCopies == 0}table-danger{/if}">
      <td>{item.title}</td>
      <td><span class="badge bg-secondary">{item.category}</span></td>
      <td>{item.rating}</td>
      <td>${item.rentalRate}</td>
      <td class="text-center">{item.totalCopies}</td>
      <td class="text-center fw-bold">{item.availableCopies}</td>
    </tr>
    {/for}
  </tbody>
</table>
