<div class="btn-group mb-3" role="group">
  <button class="btn btn-outline-primary btn-sm"
          hx-get="/stores/{store.storeId}/inventory"
          hx-target="#store-content"
          hx-swap="innerHTML">
    <i class="bi bi-film me-1"></i>Available Films
  </button>
  <button class="btn btn-outline-primary btn-sm"
          hx-get="/stores/{store.storeId}/rentals"
          hx-target="#store-content"
          hx-swap="innerHTML">
    <i class="bi bi-receipt me-1"></i>Rentals
  </button>
  <button class="btn btn-primary btn-sm"
          hx-get="/stores/{store.storeId}/customers"
          hx-target="#store-content"
          hx-swap="innerHTML">
    <i class="bi bi-people me-1"></i>Customers
  </button>
</div>
<table class="table table-sm table-striped table-hover align-middle">
  <thead class="table-dark">
    <tr>
      <th>Customer</th>
      <th>Email</th>
      <th class="text-center">Rentals</th>
      <th class="text-end">Total Spent</th>
    </tr>
  </thead>
  <tbody>
    {#for c in customers}
    <tr>
      <td class="fw-semibold">{c.customer}</td>
      <td class="text-muted small">{c.email}</td>
      <td class="text-center">{c.rentalCount}</td>
      <td class="text-end">${c.totalSpent}</td>
    </tr>
    {/for}
  </tbody>
</table>
