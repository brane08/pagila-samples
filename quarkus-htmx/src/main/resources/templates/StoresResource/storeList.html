{#include base}
  {#title}Stores - Pagila Samples{/title}
  {#body}
    <nav aria-label="breadcrumb" class="mt-3">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/">Home</a></li>
        <li class="breadcrumb-item active">Stores</li>
      </ol>
    </nav>
    <h2 class="mb-3"><i class="bi bi-shop me-2"></i>Stores</h2>
    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Manager</th>
          <th>Address</th>
          <th>District</th>
          <th>City</th>
        </tr>
      </thead>
      <tbody>
        {#for store in stores}
        <tr>
          <td><a href="/stores/{store.storeId}" class="fw-bold text-decoration-none">Store {store.storeId}</a></td>
          <td><i class="bi bi-person-circle me-1 text-muted"></i>{store.manager}</td>
          <td>{store.address}</td>
          <td>{store.district}</td>
          <td><a href="/stores/{store.storeId}" class="text-decoration-none">{store.city}</a></td>
        </tr>
        {/for}
      </tbody>
    </table>
    <div class="mt-4 d-flex gap-2">
      <a href="/stores/@sales-by-store" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-bar-chart me-1"></i>Sales by Store
      </a>
      <a href="/stores/@staff" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-person-badge me-1"></i>All Staff
      </a>
    </div>
  {/body}
{/include}
