<div class="btn-group mb-3" role="group">
  <button class="btn btn-outline-primary btn-sm"
          hx-get="/stores/{store.storeId}/inventory"
          hx-target="#store-content"
          hx-swap="innerHTML">
    <i class="bi bi-film me-1"></i>Available Films
  </button>
  <button class="btn btn-primary btn-sm"
          hx-get="/stores/{store.storeId}/rentals"
          hx-target="#store-content"
          hx-swap="innerHTML">
    <i class="bi bi-receipt me-1"></i>Rentals
  </button>
  <button class="btn btn-outline-primary btn-sm"
          hx-get="/stores/{store.storeId}/customers"
          hx-target="#store-content"
          hx-swap="innerHTML">
    <i class="bi bi-people me-1"></i>Customers
  </button>
</div>
<table class="table table-sm table-striped table-hover align-middle">
  <thead class="table-dark">
    <tr>
      <th>#</th>
      <th>Film</th>
      <th>Customer</th>
      <th>Rented</th>
      <th>Returned</th>
    </tr>
  </thead>
  <tbody>
    {#for rental in rentals}
    <tr class="{#if rental.outstanding}table-warning{/if}">
      <td class="text-muted small">{rental.rentalId}</td>
      <td>{rental.title}</td>
      <td>{rental.customer}</td>
      <td>{rental.rentalDate}</td>
      <td>
        {#if rental.outstanding}
          <span class="badge bg-warning text-dark">Outstanding</span>
        {#else}
          {rental.returnDate}
        {/if}
      </td>
    </tr>
    {/for}
  </tbody>
</table>
