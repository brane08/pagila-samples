quarkus:
  banner:
    enabled: false
  datasource:
    db-kind: postgresql
    username: postgres
    password:
    jdbc:
      url: "jdbc:postgresql://localhost:5432/sakila"
      max-size: 7
  http:
    port: 8001
    cors:
      origins: "http://localhost:4200"
      methods: GET,PUT,POST,PATCH,DELETE
      enabled: true
  log:
    category:
      "io.ebean.SQL":
        level: DEBUG